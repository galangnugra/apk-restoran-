<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Restoran Lezat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Restoran Lezat</h1>
    <p>Sistem Pemesanan Makanan & Minuman</p>
  </header>

  <div class="container">
    
    <!-- Panel Filter dan Tambah Menu -->
    <div class="controls-panel">
      <div class="categories">
        <button class="btn active" onclick="filterCategory('semua')">Semua</button>
        <button class="btn" onclick="filterCategory('makanan')">Makanan</button>
        <button class="btn" onclick="filterCategory('minuman')">Minuman</button>
      </div>
      <button class="btn btn-add-item" onclick="openModal()">+ Buat Menu Baru</button>
    </div>

    <!-- Tampilan Daftar Menu -->
    <main class="menu-section" id="menuContainer">
      <!-- Item menu dimasukkan via JavaScript -->
    </main>

    <!-- Panel Keranjang dan Detail Pesanan -->
    <aside class="cart-panel">
      <h2>Keranjang</h2>
      
      <div class="form-group">
        <label for="customerName">Nama Pelanggan:</label>
        <input type="text" id="customerName" class="form-control" placeholder="Masukkan nama Anda">
      </div>

      <ul class="cart-items" id="cartItems">
        <li style="text-align: center; color: var(--text-muted); padding: 1rem 0;">Keranjang masih kosong</li>
      </ul>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Total:</span>
          <span id="totalPrice">Rp 0</span>
        </div>
        <button class="btn btn-block btn-process" onclick="processOrder()">Proses Pesanan</button>
      </div>

      <!-- Tampilan Hasil Pesanan / Struk -->
      <div class="receipt" id="receipt">
        <h3>Ringkasan Pesanan</h3>
        <p><strong>Nama:</strong> <span id="receiptName">-</span></p>
        <div id="receiptDetails"></div>
        <p><strong>Total Bayar:</strong> <span id="receiptTotal">Rp 0</span></p>
        <p class="receipt-footer">Terima kasih telah memesan!</p>
      </div>
    </aside>

  </div>

  <!-- Modal Form Tambah Menu -->
  <div class="modal" id="addMenuModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Tambah Menu Baru</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="addMenuForm" onsubmit="addNewMenu(event)">
        <div class="form-group">
          <label for="itemName">Nama Menu</label>
          <input type="text" id="itemName" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="itemCategory">Kategori</label>
          <select id="itemCategory" class="form-control" required>
            <option value="makanan">Makanan</option>
            <option value="minuman">Minuman</option>
          </select>
        </div>
        <div class="form-group">
          <label for="itemPrice">Harga (Rp)</label>
          <input type="number" id="itemPrice" class="form-control" min="0" required>
        </div>
        <button type="submit" class="btn btn-block btn-submit">Simpan Menu</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
